name: listed
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dotted_line: ^3.2.2
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  image_picker: ^1.2.3
  firebase_storage: ^13.6.0
  intl: ^0.20.3
  geolocator: ^14.1.1
  cached_network_image: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon_1024.png
    - assets/splash_screen.png

flutter_launcher_icons:
  image_path: "assets/app_icon_1024.png"
  ios: true
  android: true

flutter_native_splash:
  color: "#17111F"
  image: "assets/splash_screen.png"
  ios: true
  android: true

  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4